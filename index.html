<!DOCTYPE html>
<html>
<head>
    <title>My Multimedia List</title>
</head>

<body>

    <h1>My Multimedia List</h1>

    <div>
        <h2>Image</h2>
        <img src="images/sample.jpg" alt="Sample Image" width="300">
    </div>

    <div>
        <h2>Audio</h2>
        <audio controls>
            <source src="music/sample.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div>
        <h2>Video</h2>
        <video controls width="400">
            <source src="videos/sample.mp4" type="video/mp4">
        </video>
    </div>

</body>
</html>
